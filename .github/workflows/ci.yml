name: NUTS - CI

on:
  push:
    branches:
      - main
      - staging
      - development
  pull_request:
    branches:
      - main
      - staging
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Lockfile Integrity Gate ─────────────────────────────────
  # Runs first, without caching, to fail fast if package.json and
  # package-lock.json are ever out of sync. Blocks all other jobs.
  lockfile-check:
    name: Lockfile Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No cache: must validate the lockfile cold

      - name: Assert lockfile is in sync with package.json
        # Dry-run does not install Prisma, so skip the postinstall DB generation hook.
        run: npm ci --dry-run --ignore-scripts

  # -- 0b. Dependency advisories ------------------------------------------------
  # Fails on any high or critical advisory in production dependencies. Lower
  # severities are reported by Dependabot and reviewed weekly.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit production dependencies (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

  # -- 0c. Database schema drift ---------------------------------------------------
  # Builds an empty database from the migrations and compares it with
  # schema.prisma. Fails if they disagree (trigram search indexes are allowed).
  schema-drift:
    name: Database Schema Drift
    runs-on: ubuntu-latest
    needs: lockfile-check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compare migrations with schema.prisma
        run: npm run check:schema-drift
        env:
          DRIFT_DATABASE_URL: postgresql://postgres@localhost:5432/drift

  # ── 1. Code Quality & Linting ──────────────────────────────────
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint Backend & Frontend
        run: npm run lint

      - name: Architecture guardrails (layering & module boundaries)
        run: npm run check:architecture

  # ── 2. Static Analysis & Type Checking ─────────────────────────
  typecheck:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck Backend & Frontend
        run: npm run typecheck

  # ── 3. Backend Unit & Validation Tests ─────────────────────────
  test-backend:
    name: Backend Validation Tests
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Backend Unit & Validation Tests
        run: npm run test:api:ci

  test-frontend-auth:
    name: Frontend Authentication Tests
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend authentication unit tests
        run: npm run test:unit --workspace=@nuts/web

  # -- Boots the real application ------------------------------------------------
  # Starts the whole Nest application (every module, the validation pipe, auth,
  # payments) with the database replaced by an in-memory stand-in, and runs the
  # checkout, payment and webhook flow. Unit tests never start the application, so a
  # missing runtime package or a broken module graph would otherwise reach a deploy.
  test-backend-e2e:
    name: Backend End-to-End Tests
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run end-to-end tests
        run: npm run test:e2e

  # ── 4. Production Build Verification ───────────────────────────
  build-apps:
    name: Build Verification (API & Web)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-backend, test-frontend-auth]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build API Application
        run: npm run build:api

      - name: Build Web Application
        run: npm run build:web
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
